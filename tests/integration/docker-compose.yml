services:
  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: Chang3d!Passw0rd
      SPLUNK_HEC_TOKEN: 00000000-0000-0000-0000-000000000001
      SPLUNK_HEC_SSL: "false"
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/services/collector/health | grep -q HEC"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:latest
    environment:
      SPLUNK_CONFIG: /etc/otel/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      splunk:
        condition: service_healthy
